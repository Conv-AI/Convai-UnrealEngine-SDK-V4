name: Build and Release Unreal Plugin

on:
  push:
    branches:
      - main
      - staging
      - beta
  workflow_dispatch:

# Explicitly grant permissions to GITHUB_TOKEN
permissions:
  contents: write    # Required for creating releases and pushing tags
  actions: read      # Required for workflow execution
  checks: read       # Required for status checks

jobs:
  checkout-code:
    runs-on: UE-Dev-Runner
    outputs:
      version_name: ${{ steps.extract_version.outputs.version_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Extract version from .uplugin
        id: extract_version
        run: |
          $plugin = Get-Content "ConvAI.uplugin" | ConvertFrom-Json
          $plugin_version = $plugin.VersionName
          echo "::set-output name=version_name::$plugin_version"
        shell: pwsh

  check-version:
    needs: checkout-code
    runs-on: UE-Dev-Runner
    outputs:
      release_exists: ${{ steps.check_release.outputs.release_exists }}  # Define job output based on step output
    steps:
      - name: Check if release exists using GitHub API
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Construct release name
          $release_name = "Convai Unreal Engine SDK Version ${{ needs.checkout-code.outputs.version_name }}"

          # Fetch releases
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }

          # Check if release already exists
          $release_exists = $false
          foreach ($release in $releases) {
              if ($release.name -eq $release_name) {
                  $release_exists = $true
                  break
              }
          }

          # Set step output
          if ($release_exists) {
              echo "::set-output name=release_exists::true"
          } else {
              echo "::set-output name=release_exists::false"
          }
        shell: pwsh

  build-and-package:
    needs: check-version
    runs-on: UE-Dev-Runner
    if: needs.check-version.outputs.release_exists == 'false'
    steps:
      - name: Debug output
        run: |
          echo "Release exists output: ${{ needs.check-version.outputs.release_exists }}"

      - name: Checkout code
        uses: actions/checkout@v2

      - name: Remove Test folders from Source
        run: |
          $plugin_dir = "${{ github.workspace }}"
          $test_folders = Get-ChildItem -Path "$plugin_dir/Source" -Recurse -Directory | Where-Object { $_.Name -match "Test" }
          if ($test_folders) {
              foreach ($folder in $test_folders) {
                  Write-Host "Removed: $($folder.FullName)"
                  Remove-Item -Recurse -Force $folder.FullName
              }
              Write-Host "Removed $($test_folders.Count) Test-related folder(s) from Source directory."
          } else {
              Write-Host "No Test-related folders found in Source directory."
          }
        shell: pwsh

      - name: Define paths
        id: paths
        run: |
          $repo_name = "${{ github.event.repository.name }}"
          $ue_root = "E:/Software"
          $output_root = "E:/Output/${repo_name}_Binaries"
          $plugin_path = "${{ github.workspace }}/ConvAI.uplugin"
          echo "::set-output name=ue_root::$ue_root"
          echo "::set-output name=output_root::$output_root"
          echo "::set-output name=plugin_path::$plugin_path"
        shell: pwsh

      - name: Extract and Copy Dependencies
        run: |
          try {
            $dependencies_dir = "E:/Dependencies_V4"
            $plugin_dir = "${{ github.workspace }}"
            $content_zip = "$dependencies_dir/Content.zip"
            $thirdparty_zip = "$dependencies_dir/ThirdParty.zip"
            $plugin_content_dir = "$plugin_dir/Content"
            $plugin_thirdparty_dir = "$plugin_dir/Source/ThirdParty"
            if (Test-Path $plugin_content_dir) {
                Remove-Item -Recurse -Force $plugin_content_dir
            }
            if (Test-Path $plugin_thirdparty_dir) {
                Remove-Item -Recurse -Force $plugin_thirdparty_dir
            }
            Expand-Archive -Path $content_zip -DestinationPath $plugin_dir
            Expand-Archive -Path $thirdparty_zip -DestinationPath "$plugin_dir/Source"
            Write-Host "Dependencies extracted and copied successfully."
          } catch {
            Write-Host "Failed to extract and copy dependencies. Error: $_"
            exit 1
          }
        shell: pwsh

      - name: Copy ThirdParty DLLs to Binaries folder
        run: |
          $plugin_dir = "${{ github.workspace }}"
          $thirdparty_base = "$plugin_dir/Source/ThirdParty/ConvaiWebRTC/lib/release"
          
          # Windows DLLs
          $win64_source = "$thirdparty_base/win64"
          $win64_dest = "$plugin_dir/Binaries/Win64"
          if (Test-Path $win64_source) {
              if (-not (Test-Path $win64_dest)) {
                  New-Item -Path $win64_dest -ItemType Directory -Force | Out-Null
              }
              $dlls = Get-ChildItem -Path $win64_source -Filter "*.dll"
              foreach ($dll in $dlls) {
                  Copy-Item -Path $dll.FullName -Destination $win64_dest -Force
                  Write-Host "Copied $($dll.Name) to $win64_dest"
              }
          } else {
              Write-Host "Win64 ThirdParty path not found: $win64_source"
          }
          
          # Mac dylibs (if they exist)
          $mac_source = "$thirdparty_base/mac"
          $mac_dest = "$plugin_dir/Binaries/Mac"
          if (Test-Path $mac_source) {
              if (-not (Test-Path $mac_dest)) {
                  New-Item -Path $mac_dest -ItemType Directory -Force | Out-Null
              }
              $dylibs = Get-ChildItem -Path $mac_source -Filter "*.dylib" -ErrorAction SilentlyContinue
              foreach ($dylib in $dylibs) {
                  Copy-Item -Path $dylib.FullName -Destination $mac_dest -Force
                  Write-Host "Copied $($dylib.Name) to $mac_dest"
              }
          } else {
              Write-Host "Mac ThirdParty path not found (skipping): $mac_source"
          }
          
          # Linux shared objects (if they exist)
          $linux_source = "$thirdparty_base/linux"
          $linux_dest = "$plugin_dir/Binaries/Linux"
          if (Test-Path $linux_source) {
              if (-not (Test-Path $linux_dest)) {
                  New-Item -Path $linux_dest -ItemType Directory -Force | Out-Null
              }
              $sos = Get-ChildItem -Path $linux_source -Filter "*.so" -ErrorAction SilentlyContinue
              foreach ($so in $sos) {
                  Copy-Item -Path $so.FullName -Destination $linux_dest -Force
                  Write-Host "Copied $($so.Name) to $linux_dest"
              }
              # Also copy versioned .so files (e.g., .so.1, .so.1.0.0)
              $sos_versioned = Get-ChildItem -Path $linux_source -Filter "*.so.*" -ErrorAction SilentlyContinue
              foreach ($so in $sos_versioned) {
                  Copy-Item -Path $so.FullName -Destination $linux_dest -Force
                  Write-Host "Copied $($so.Name) to $linux_dest"
              }
          } else {
              Write-Host "Linux ThirdParty path not found (skipping): $linux_source"
          }

          # Android shared objects (if they exist)
          $android_archs = @("armeabi-v7a", "arm64-v8a", "x86_64")
          foreach ($arch in $android_archs) {
              $android_source = "$thirdparty_base/android/$arch"
              $android_dest = "$plugin_dir/Binaries/Android/$arch"
              if (Test-Path $android_source) {
                  if (-not (Test-Path $android_dest)) {
                      New-Item -Path $android_dest -ItemType Directory -Force | Out-Null
                  }
                  $sos = Get-ChildItem -Path $android_source -Filter "*.so" -ErrorAction SilentlyContinue
                  foreach ($so in $sos) {
                      Copy-Item -Path $so.FullName -Destination $android_dest -Force
                      Write-Host "Copied $($so.Name) to $android_dest"
                  }
                  $afiles = Get-ChildItem -Path $android_source -Filter "*.a" -ErrorAction SilentlyContinue
                  foreach ($afile in $afiles) {
                      Copy-Item -Path $afile.FullName -Destination $android_dest -Force
                      Write-Host "Copied $($afile.Name) to $android_dest"
                  }
              } else {
                  Write-Host "Android ThirdParty path not found (skipping): $android_source"
              }
          }

          Write-Host "ThirdParty binaries copied to plugin Binaries folder successfully."
        shell: pwsh

      - name: Build and package for Unreal versions 5.3 to 5.8
        run: |
          try {
            $versions = @("5.3", "5.4", "5.5", "5.6", "5.7", "5.8")
            $plugin_dir = "${{ github.workspace }}"
            $dependencies_mh_fix_dir = "E:/Dependencies_MH_fix"
            $mh_fix_applied = $false
            function Test-AccessiblePath([string]$PathValue) {
                if ([string]::IsNullOrWhiteSpace($PathValue)) {
                    return $false
                }
                try {
                    Get-Item -LiteralPath $PathValue -ErrorAction Stop | Out-Null
                    return $true
                } catch {
                    Write-Host "Path is not accessible: $PathValue ($($_.Exception.Message))"
                    return $false
                }
            }

            function Get-FirstAccessiblePath([string[]]$Candidates, [string]$Label) {
                foreach ($candidate in $Candidates) {
                    if (Test-AccessiblePath $candidate) {
                        return $candidate
                    }
                }

                $candidate_list = ($Candidates | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique) -join "; "
                throw "No accessible path found for ${Label}. Candidates checked: $candidate_list"
            }

            function Set-AndroidToolchainEnv([string]$NdkVersion, [string]$Label) {
                $sdk_candidates = @(
                    $env:ANDROID_HOME,
                    $env:ANDROID_SDK_ROOT,
                    [Environment]::GetEnvironmentVariable("ANDROID_HOME", "Machine"),
                    [Environment]::GetEnvironmentVariable("ANDROID_SDK_ROOT", "Machine"),
                    [Environment]::GetEnvironmentVariable("ANDROID_HOME", "User"),
                    [Environment]::GetEnvironmentVariable("ANDROID_SDK_ROOT", "User"),
                    (Join-Path $env:LOCALAPPDATA "Android\Sdk"),
                    "C:\Users\convaidev\AppData\Local\Android\Sdk"
                ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique

                $android_sdk_root = Get-FirstAccessiblePath -Candidates $sdk_candidates -Label "Android SDK root for $Label"
                $ndk_root = Join-Path $android_sdk_root "ndk\$NdkVersion"
                $java_candidates = @(
                    $env:JAVA_HOME,
                    [Environment]::GetEnvironmentVariable("JAVA_HOME", "Machine"),
                    [Environment]::GetEnvironmentVariable("JAVA_HOME", "User"),
                    "C:\Program Files\Android\Android Studio\jbr",
                    "C:\Program Files\Android\Android Studio\jre"
                ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique

                $env:ANDROID_HOME = $android_sdk_root
                $env:ANDROID_SDK_ROOT = $android_sdk_root
                $env:NDK_ROOT = $ndk_root
                $env:NDKROOT = $ndk_root
                $env:ANDROID_NDK_ROOT = $ndk_root

                $env:JAVA_HOME = Get-FirstAccessiblePath -Candidates $java_candidates -Label "JAVA_HOME for $Label"

                $required_paths = @{
                    "ANDROID_HOME" = $env:ANDROID_HOME
                    "ANDROID_SDK_ROOT" = $env:ANDROID_SDK_ROOT
                    "NDK_ROOT" = $env:NDK_ROOT
                    "NDKROOT" = $env:NDKROOT
                    "ANDROID_NDK_ROOT" = $env:ANDROID_NDK_ROOT
                    "JAVA_HOME" = $env:JAVA_HOME
                }

                foreach ($entry in $required_paths.GetEnumerator()) {
                    if (-not (Test-AccessiblePath $entry.Value)) {
                        throw "$($entry.Key) path is not accessible for ${Label}: $($entry.Value)"
                    }
                }

                Write-Host "Resolved Android toolchain for $Label"
                Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
                Write-Host "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT"
                Write-Host "NDK_ROOT=$env:NDK_ROOT"
                Write-Host "NDKROOT=$env:NDKROOT"
                Write-Host "ANDROID_NDK_ROOT=$env:ANDROID_NDK_ROOT"
                Write-Host "JAVA_HOME=$env:JAVA_HOME"
            }

            foreach ($version in $versions) {
                # Apply MetaHuman fixes when reaching 5.6 (for 5.6 and above)
                if ($version -eq "5.6" -and -not $mh_fix_applied) {
                    $mh_fix_content = "$dependencies_mh_fix_dir/Content"
                    $plugin_content_dir = "$plugin_dir/Content"
                    if (Test-Path $mh_fix_content) {
                        Write-Host "Applying MetaHuman fixes from $mh_fix_content to $plugin_content_dir..."
                        Copy-Item -Path "$mh_fix_content/*" -Destination $plugin_content_dir -Recurse -Force
                        Write-Host "MetaHuman fixes applied successfully for UE 5.6 and above."
                        $mh_fix_applied = $true
                    } else {
                        Write-Host "Warning: MetaHuman fix directory not found at $mh_fix_content"
                    }
                }

                # Set Android NDK environment variables based on UE version
                if ($version -eq "5.6" -or $version -eq "5.7" -or $version -eq "5.8") {
                    Set-AndroidToolchainEnv -NdkVersion "27.2.12479018" -Label "UE $version"
                } else {
                    Set-AndroidToolchainEnv -NdkVersion "25.1.8937393" -Label "UE $version"
                }

                # Set LINUX_MULTIARCH_ROOT based on Unreal version
                if ($version -eq "5.7" -or $version -eq "5.8") {
                    $env:LINUX_MULTIARCH_ROOT = "C:\UnrealToolchains\v26_clang-20.1.8-rockylinux8"
                    Write-Host "Set LINUX_MULTIARCH_ROOT to $env:LINUX_MULTIARCH_ROOT for UE $version"
                } else {
                    $env:LINUX_MULTIARCH_ROOT = "C:\UnrealToolchains\v25_clang-18.1.0-rockylinux8"
                    Write-Host "Set LINUX_MULTIARCH_ROOT to $env:LINUX_MULTIARCH_ROOT for UE $version"
                }

                $ue_version_path = "${{ steps.paths.outputs.ue_root }}/UE_$version"
                $output_path = "${{ steps.paths.outputs.output_root }}/V$version/Convai"
                if (Test-Path $output_path) {
                    Remove-Item -Recurse -Force -Path "$output_path/*"
                } else {
                    New-Item -Path $output_path -ItemType Directory
                }
                # ---- Per-version MSVC toolchain pin ----
                # UE <=5.7 require MSVC <=14.39 (14.40+ breaks engine code, e.g. ConcurrentLinearAllocator).
                # UE 5.8 requires >=14.44 (14.38 fails compiling its container headers). Both toolchains
                # must be installed on the runner. BuildPlugin ignores the -CompilerVersion arg, so pin via
                # the user BuildConfiguration.xml; a surgical regex swap preserves other settings.
                $msvcVersion = if ($version -eq "5.8") { "14.44.35207" } else { "14.38.33130" }
                $ubtDir = Join-Path $env:APPDATA "Unreal Engine\UnrealBuildTool"
                $ubtConfig = Join-Path $ubtDir "BuildConfiguration.xml"
                New-Item -ItemType Directory -Force -Path $ubtDir | Out-Null
                if (Test-Path $ubtConfig) { $cfgXml = Get-Content $ubtConfig -Raw } else { $cfgXml = "<?xml version=`"1.0`" encoding=`"utf-8`"?>`r`n<Configuration xmlns=`"https://www.unrealengine.com/BuildConfiguration`">`r`n</Configuration>" }
                if ($cfgXml -match "<CompilerVersion>") {
                    $cfgXml = $cfgXml -replace "<CompilerVersion>[^<]*</CompilerVersion>", "<CompilerVersion>$msvcVersion</CompilerVersion>"
                    $cfgXml = $cfgXml -replace "<ToolchainVersion>[^<]*</ToolchainVersion>", "<ToolchainVersion>$msvcVersion</ToolchainVersion>"
                } else {
                    $cfgXml = $cfgXml -replace "</Configuration>", "  <WindowsPlatform>`r`n    <CompilerVersion>$msvcVersion</CompilerVersion>`r`n    <ToolchainVersion>$msvcVersion</ToolchainVersion>`r`n  </WindowsPlatform>`r`n</Configuration>"
                }
                Set-Content -Path $ubtConfig -Value $cfgXml -Encoding UTF8
                Write-Host "Pinned MSVC $msvcVersion for UE $version"

                Write-Host "Starting packaging for UE_$version..."
                $uat_path = "$ue_version_path/Engine/Build/BatchFiles/RunUAT.bat"
                & $uat_path BuildPlugin -Plugin="${{ steps.paths.outputs.plugin_path }}" -Package="$output_path" -Rocket -Marketplace -TargetPlatforms=Win64+Android
                if ($LASTEXITCODE -ne 0) {
                    Write-Host "Packaging failed for UE_$version. Exit code: $LASTEXITCODE"
                    exit $LASTEXITCODE
                }
                Write-Host "Packaged for UE_$version at $output_path"
            }
          } catch {
            Write-Host "Packaging failed for Unreal Engine version $version. Error: $_"
            exit 1
          }
        shell: pwsh

      - name: Test packaging for Windows UE 5.6
        run: |
          try {
            $ue_version_path = "${{ steps.paths.outputs.ue_root }}/UE_5.6"
            $output_path = "${{ steps.paths.outputs.output_root }}/V5.6"
            $test_project_path = "E:/Software/TestProject"
            $plugin_folder = "$test_project_path/Plugins"
            if (Test-Path $plugin_folder) {
                Remove-Item -Recurse -Force $plugin_folder
            }
            New-Item -Path $plugin_folder -ItemType Directory
            Copy-Item -Recurse -Force "$output_path/Convai" $plugin_folder
            Write-Host "Copied the plugin to the TestProject."
            $uat_path = "$ue_version_path/Engine/Build/BatchFiles/RunUAT.bat"
            Write-Host "Starting project packaging for Unreal 5.6..."
            & $uat_path BuildCookRun `
            -project="$test_project_path/TestProject.uproject" `
            -noP4 -utf8output -platform=Win64 -clientconfig=Shipping -cook -stage -package -compressed -pak `
            -build -prereqs -distribution -archive `
            -archivedirectory="$test_project_path/Windows"
            if ($LASTEXITCODE -ne 0) {
                Write-Host "Packaging failed for UE_$version. Exit code: $LASTEXITCODE"
                exit $LASTEXITCODE
            }
            Write-Host "Project packaging completed successfully for Unreal 5.6"
          } catch {
            Write-Host "Project packaging failed for Unreal Engine 5.6. Error: $_"
            exit 1
          }
        shell: pwsh

      - name: Test packaging for Android UE 5.6
        run: |
          try {
            function Test-AccessiblePath([string]$PathValue) {
                if ([string]::IsNullOrWhiteSpace($PathValue)) {
                    return $false
                }

                try {
                    Get-Item -LiteralPath $PathValue -ErrorAction Stop | Out-Null
                    return $true
                } catch {
                    Write-Host "Path is not accessible: $PathValue ($($_.Exception.Message))"
                    return $false
                }
            }

            function Get-FirstAccessiblePath([string[]]$Candidates, [string]$Label) {
                foreach ($candidate in $Candidates) {
                    if (Test-AccessiblePath $candidate) {
                        return $candidate
                    }
                }

                $candidate_list = ($Candidates | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique) -join "; "
                throw "No accessible path found for ${Label}. Candidates checked: $candidate_list"
            }

            function Set-AndroidToolchainEnv([string]$NdkVersion, [string]$Label) {
                $sdk_candidates = @(
                    $env:ANDROID_HOME,
                    $env:ANDROID_SDK_ROOT,
                    [Environment]::GetEnvironmentVariable("ANDROID_HOME", "Machine"),
                    [Environment]::GetEnvironmentVariable("ANDROID_SDK_ROOT", "Machine"),
                    [Environment]::GetEnvironmentVariable("ANDROID_HOME", "User"),
                    [Environment]::GetEnvironmentVariable("ANDROID_SDK_ROOT", "User"),
                    (Join-Path $env:LOCALAPPDATA "Android\Sdk"),
                    "C:\Users\convaidev\AppData\Local\Android\Sdk"
                ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique

                $android_sdk_root = Get-FirstAccessiblePath -Candidates $sdk_candidates -Label "Android SDK root for $Label"
                $ndk_root = Join-Path $android_sdk_root "ndk\$NdkVersion"
                $java_candidates = @(
                    $env:JAVA_HOME,
                    [Environment]::GetEnvironmentVariable("JAVA_HOME", "Machine"),
                    [Environment]::GetEnvironmentVariable("JAVA_HOME", "User"),
                    "C:\Program Files\Android\Android Studio\jbr",
                    "C:\Program Files\Android\Android Studio\jre"
                ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique

                $env:ANDROID_HOME = $android_sdk_root
                $env:ANDROID_SDK_ROOT = $android_sdk_root
                $env:NDK_ROOT = $ndk_root
                $env:NDKROOT = $ndk_root
                $env:ANDROID_NDK_ROOT = $ndk_root

                $env:JAVA_HOME = Get-FirstAccessiblePath -Candidates $java_candidates -Label "JAVA_HOME for $Label"

                $required_paths = @{
                    "ANDROID_HOME" = $env:ANDROID_HOME
                    "ANDROID_SDK_ROOT" = $env:ANDROID_SDK_ROOT
                    "NDK_ROOT" = $env:NDK_ROOT
                    "NDKROOT" = $env:NDKROOT
                    "ANDROID_NDK_ROOT" = $env:ANDROID_NDK_ROOT
                    "JAVA_HOME" = $env:JAVA_HOME
                }

                foreach ($entry in $required_paths.GetEnumerator()) {
                    if (-not (Test-AccessiblePath $entry.Value)) {
                        throw "$($entry.Key) path is not accessible for ${Label}: $($entry.Value)"
                    }
                }

                Write-Host "Resolved Android toolchain for $Label"
                Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
                Write-Host "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT"
                Write-Host "NDK_ROOT=$env:NDK_ROOT"
                Write-Host "NDKROOT=$env:NDKROOT"
                Write-Host "ANDROID_NDK_ROOT=$env:ANDROID_NDK_ROOT"
                Write-Host "JAVA_HOME=$env:JAVA_HOME"
            }

            Set-AndroidToolchainEnv -NdkVersion "27.2.12479018" -Label "Android UE 5.6 test packaging"

            $ue_version_path = "${{ steps.paths.outputs.ue_root }}/UE_5.6"
            $output_path = "${{ steps.paths.outputs.output_root }}/V5.6"
            $test_project_path = "E:/Software/TestProject"
            $plugin_folder = "$test_project_path/Plugins"
            if (Test-Path $plugin_folder) {
                Remove-Item -Recurse -Force $plugin_folder
            }
            New-Item -Path $plugin_folder -ItemType Directory
            Copy-Item -Recurse -Force "$output_path/Convai" $plugin_folder
            Write-Host "Copied the plugin to the TestProject."
            $uat_path = "$ue_version_path/Engine/Build/BatchFiles/RunUAT.bat"

            $staged_path = "$test_project_path/Saved/StagedBuilds"
            if (Test-Path $staged_path) {
                Write-Host "Removing old staged Android builds..."
                Remove-Item -Recurse -Force "$staged_path/Android*" -ErrorAction SilentlyContinue
            }
            
            $android_archive_path = "$test_project_path/Android"
            if (Test-Path $android_archive_path) {
                Write-Host "Removing old Android archive..."
                Remove-Item -Recurse -Force $android_archive_path -ErrorAction SilentlyContinue
            }

            Write-Host "Starting Android project packaging for Unreal 5.6..."
            & $uat_path BuildCookRun `
            -project="$test_project_path/TestProject.uproject" `
            -noP4 -utf8output -platform=Android -clientconfig=Shipping -cook -stage -package -compressed -pak `
            -build -prereqs -distribution -archive `
            -archivedirectory="$test_project_path/Android" 
            if ($LASTEXITCODE -ne 0) {
                Write-Host "Android packaging failed for UE 5.6. Exit code: $LASTEXITCODE"
                exit $LASTEXITCODE
            }
            Write-Host "Android project packaging completed successfully for Unreal 5.6"
          } catch {
            Write-Host "Android project packaging failed for Unreal Engine 5.6. Error: $_"
            exit 1
          }
        shell: pwsh

      - name: Cleanup plugin artifacts before zipping
        run: |
          $versions = @("5.8","5.7","5.6","5.5","5.4","5.3")
          $output_base = "${{ steps.paths.outputs.output_root }}"
          $cleanup_script = "E:/Scripts/Cleanup.py"
          
          # Check if script exists
          if (!(Test-Path $cleanup_script)) {
              Write-Error "Cleanup script not found at $cleanup_script"
              exit 1
          }

          foreach ($version in $versions) {
              $plugin_root = "$output_base/V$version/Convai"

              if (!(Test-Path $plugin_root)) {
                  Write-Warning "Plugin path not found: $plugin_root (skipping)"
                  continue
              }

              $log = python $cleanup_script cleanup --path $plugin_root 2>&1

              if ($LASTEXITCODE -ne 0) {
                  Write-Host "Cleanup failed for UE$version (exit $LASTEXITCODE)"
                  Write-Host ($log | Out-String)
                  exit $LASTEXITCODE
              }
          }
        shell: pwsh

      - name: Zip Plugin for each version
        run: |
          try {
            $versions = @("5.8","5.7","5.6","5.5","5.4","5.3")
            $output_base = "${{ steps.paths.outputs.output_root }}"
            foreach ($version in $versions) {
                $output_path = "$output_base/V$version"
                $zip_name = "$output_base/Convai-UE$version.zip"
                Compress-Archive -Path "$output_path" -DestinationPath "$zip_name" -Force
                Write-Host "Zipped plugin for UE$version at $zip_name"
            }
          } catch {
            Write-Host "Zipping failed. Error: $_"
            exit 1
          }
        shell: pwsh

  compress-and-release:
    needs: [checkout-code, check-version, build-and-package]
    runs-on: UE-Dev-Runner
    if: needs.check-version.outputs.release_exists == 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract release notes
        run: |
          $version = "${{ needs.checkout-code.outputs.version_name }}"
          $lines = Get-Content "CHANGELOG.md"
          $escaped = [regex]::Escape($version)
          # Find the "# Release <version>" header (end-anchored so beta.2 != beta.22).
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "^#\s*Release\s+$escaped\s*$") { $start = $i; break }
          }
          if ($start -lt 0) {
              Write-Error "Could not find a '# Release $version' section in CHANGELOG.md"
              exit 1
          }
          # Collect every line until the next release header (full section, no line cap).
          $body = @()
          for ($j = $start + 1; $j -lt $lines.Count; $j++) {
              if ($lines[$j] -match "^#\s*Release\s+") { break }
              $body += $lines[$j]
          }
          $notes = ($body -join "`n").Trim()
          # Write to a file and feed the release via body_path - avoids the
          # single-line truncation that ::set-output / GITHUB_OUTPUT impose.
          Set-Content -Path "release_notes.md" -Value $notes -Encoding UTF8
          Write-Host "=== Release notes for $version ==="
          Write-Host $notes
        shell: pwsh

      - name: Create Git tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "=== Git Tag Creation Debug Info ==="
          Write-Host "Repository: ${{ github.repository }}"
          Write-Host "Actor: ${{ github.actor }}"
          Write-Host "Event: ${{ github.event_name }}"
          Write-Host "Ref: ${{ github.ref }}"

          # Check if token is available (without exposing it)
          if ($env:GITHUB_TOKEN) {
            Write-Host "✓ GITHUB_TOKEN is available (length: $($env:GITHUB_TOKEN.Length))"
          } else {
            Write-Host "✗ GITHUB_TOKEN is not available"
            exit 1
          }

          Write-Host "Configuring git user..."
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          Write-Host "Current git remote URL:"
          git remote get-url origin

          Write-Host "Configuring git remote for token authentication..."
          git remote set-url origin https://x-access-token:$env:GITHUB_TOKEN@github.com/${{ github.repository }}.git

          Write-Host "Updated git remote URL (token masked):"
          git remote get-url origin | ForEach-Object { $_ -replace $env:GITHUB_TOKEN, "***TOKEN***" }

          $version = "${{ needs.checkout-code.outputs.version_name }}"
          Write-Host "Version to tag: '$version'"
          if (-not $version) {
            Write-Host "✗ Version is empty!"
            exit 1
          }

          Write-Host "Creating git tag: $version"
          git tag $version
          if ($LASTEXITCODE -ne 0) {
            Write-Host "⚠️ Tag creation failed - checking if tag already exists..."
            $existingTag = git tag -l $version
            if ($existingTag) {
              Write-Host "✓ Tag '$version' already exists locally, continuing..."
            } else {
              Write-Host "✗ Failed to create tag for unknown reason"
              exit 1
            }
          } else {
            Write-Host "✓ Successfully created tag locally"
          }

          Write-Host "Checking if tag exists locally:"
          git tag -l $version

          Write-Host "Pushing tag to remote..."
          git push origin $version
          if ($LASTEXITCODE -ne 0) {
            Write-Host "⚠️ Tag push failed - checking if tag already exists on remote..."

            # Check if the tag exists on remote
            $remoteTag = git ls-remote --tags origin $version
            if ($remoteTag) {
              Write-Host "✓ Tag '$version' already exists on remote, continuing..."
            } else {
              Write-Host "✗ Failed to push tag and tag doesn't exist on remote"
              Write-Host "Git status:"
              git status
              Write-Host "Git remote -v:"
              git remote -v
              exit 1
            }
          } else {
            Write-Host "✓ Successfully pushed tag to remote"
          }

          Write-Host "✓ Successfully created and pushed tag: $version"
        shell: pwsh

      - name: Confirm Git tag exists
        run: |
          $version = "${{ needs.checkout-code.outputs.version_name }}"
          if (-not $version) { Write-Host "Version is empty!"; exit 1 }
          git fetch --tags
          git show-ref --tags | Select-String $version
        shell: pwsh

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.checkout-code.outputs.version_name }}
          name: "Convai Unreal Engine SDK Version ${{ needs.checkout-code.outputs.version_name }}"
          body_path: release_notes.md
          files: |
            E:/Output/${{ github.event.repository.name }}_Binaries/Convai-UE5.8.zip
            E:/Output/${{ github.event.repository.name }}_Binaries/Convai-UE5.7.zip
            E:/Output/${{ github.event.repository.name }}_Binaries/Convai-UE5.6.zip
            E:/Output/${{ github.event.repository.name }}_Binaries/Convai-UE5.5.zip
            E:/Output/${{ github.event.repository.name }}_Binaries/Convai-UE5.4.zip
            E:/Output/${{ github.event.repository.name }}_Binaries/Convai-UE5.3.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
